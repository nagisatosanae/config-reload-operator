apiVersion: v2
name: config-reload-operator
description: Reloads an app by signal when its ConfigMap changes, without replacing the Pod.
type: application

# Version of the chart.
version: 0.2.2

# Version of the controller. It is also the default image tag.
appVersion: "0.2.1"

# The webhook uses matchConditions, which is stable since Kubernetes 1.30.
# The "-0" lets versions with a suffix through, such as v1.30.5-gke.1.
kubeVersion: ">=1.30.0-0"

home: https://github.com/nagisatosanae/config-reload-operator
sources:
  - https://github.com/nagisatosanae/config-reload-operator
