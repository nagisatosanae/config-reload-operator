---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: configreloadpolicies.reload.nagisatosanae.github.io
spec:
  group: reload.nagisatosanae.github.io
  names:
    kind: ConfigReloadPolicy
    listKind: ConfigReloadPolicyList
    plural: configreloadpolicies
    shortNames:
    - crp
    singular: configreloadpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.workloadRef.name
      name: Workload
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.pods
      name: Pods
      type: integer
    - jsonPath: .status.injectedPods
      name: Injected
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ConfigReloadPolicy is the Schema for the configreloadpolicies
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ConfigReloadPolicy
            properties:
              containers:
                description: |-
                  containers lists the containers of the workload that get the watcher
                  settings, one entry for each container.
                items:
                  description: |-
                    ContainerSettings says what one container of the workload gets: which
                    ConfigMap, where it is mounted, and how the app is told to reload.
                  properties:
                    configMapRef:
                      description: configMapRef is the ConfigMap mounted into that
                        container.
                      properties:
                        name:
                          description: |-
                            name is the name of the ConfigMap. It must be in the same namespace as
                            the policy.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    mountPath:
                      description: |-
                        mountPath is the directory in that container where the ConfigMap is
                        mounted. The watcher watches this directory. It must be an absolute
                        path with no slash at the end, like /etc/nginx/conf.d.
                      maxLength: 4096
                      minLength: 2
                      type: string
                      x-kubernetes-validations:
                      - message: mountPath must be an absolute path with no slash
                          at the end, like /etc/nginx/conf.d
                        rule: self.startsWith('/') && !self.endsWith('/')
                    name:
                      description: |-
                        name is the container that runs the watcher and the app. A container
                        can be named only once in a policy.
                      maxLength: 63
                      minLength: 1
                      type: string
                    reload:
                      default: {}
                      description: |-
                        reload says how to reload the app. If you leave it out, the app gets
                        SIGHUP three seconds after the last change.
                      properties:
                        debounceSeconds:
                          default: 3
                          description: |-
                            debounceSeconds is how long to wait after the last change before
                            reloading. It is a quiet period, not a polling interval.
                          format: int32
                          maximum: 3600
                          minimum: 0
                          type: integer
                        signal:
                          default: SIGHUP
                          description: signal is the signal sent to the app when the
                            config changes.
                          enum:
                          - SIGHUP
                          - SIGUSR1
                          - SIGUSR2
                          type: string
                        validateCommand:
                          description: |-
                            validateCommand is a command that checks the new config before the
                            signal is sent, for example ["nginx", "-t"]. It runs inside the
                            container, without a shell. If it exits with a non-zero code, the
                            signal is not sent and the app keeps its current config. Leave it out
                            to skip the check.
                          items:
                            minLength: 1
                            type: string
                          maxItems: 32
                          type: array
                          x-kubernetes-list-type: atomic
                      type: object
                  required:
                  - configMapRef
                  - mountPath
                  - name
                  type: object
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              workloadRef:
                description: |-
                  workloadRef is the workload to reload. A workload can have only one
                  policy. It cannot be changed after the policy is created. To point at
                  another workload, delete the policy and create a new one. Pods of the
                  old workload keep their settings until they are replaced.
                properties:
                  kind:
                    default: Deployment
                    description: kind is the kind of the workload. Only Deployment
                      is supported for now.
                    enum:
                    - Deployment
                    type: string
                  name:
                    description: |-
                      name is the name of the workload. It must be in the same namespace as
                      the policy.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: workloadRef cannot be changed. Delete the policy and create
                    a new one.
                  rule: self == oldSelf
            required:
            - containers
            - workloadRef
            type: object
          status:
            description: status defines the observed state of ConfigReloadPolicy
            properties:
              conditions:
                description: |-
                  conditions holds the state of the policy. The controller sets one
                  condition, "Ready". It is True when every Pod of the workload that asks
                  for the settings carries them as the policy is now, and also when
                  there are no Pods yet. When it is False, the reason and the message
                  say what is wrong.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              injectedPods:
                description: |-
                  injectedPods is how many of those Pods carry the settings of this
                  policy as it is now.
                format: int32
                type: integer
              pods:
                description: |-
                  pods is the number of Pods of the workload that this policy applies
                  to. A zero is written out, so kubectl shows 0 and not an empty column.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
