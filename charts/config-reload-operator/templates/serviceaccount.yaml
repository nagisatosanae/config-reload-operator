# The controller and the webhook each run as their own account, so each gets
# only the rights it needs. See rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "config-reload-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "config-reload-operator.labels" . | nindent 4 }}
{{- if .Values.webhook.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "config-reload-operator.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "config-reload-operator.labels" . | nindent 4 }}
{{- end }}
