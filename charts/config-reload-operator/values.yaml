# Number of controller Pods. Leader election is always on, so with more than
# one Pod a single Pod does the work and the others wait to take over.
replicaCount: 1

image:
  repository: ghcr.io/nagisatosanae/config-reload-operator/manager
  # Empty means the appVersion in Chart.yaml.
  tag: ""
  pullPolicy: IfNotPresent

# Secrets for pulling the image from a private registry.
imagePullSecrets: []

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# The admission webhook sets the watcher settings on a Deployment while it is
# being created or updated, so its first Pods already have them. Without the
# webhook the controller does this a moment later, and the Pods are replaced
# one more time. The webhook only looks at a Deployment with the annotation
# reload.nagisatosanae.github.io/inject: "true".
webhook:
  enabled: true
  # What the API server does when it cannot reach the webhook. Ignore lets
  # the Deployment through, and the controller fixes it afterwards. Fail
  # rejects the Deployment.
  failurePolicy: Ignore
  # How many seconds the API server waits for the webhook.
  timeoutSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
