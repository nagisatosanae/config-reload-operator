# Number of controller Pods. Leader election is always on, so with more than
# one Pod a single Pod does the work and the others wait to take over.
replicaCount: 1

image:
  repository: ghcr.io/nagisatosanae/config-reload-operator/manager
  # Empty means the appVersion in Chart.yaml.
  tag: ""
  pullPolicy: IfNotPresent

# Secrets for pulling the image from a private registry.
imagePullSecrets: []

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# The admission webhook puts the watcher settings on a Pod while it is being
# created: the ConfigMap volume, its mount and the env. It only looks at a Pod
# with the annotation reload.nagisatosanae.github.io/inject: "true", which you
# put on the Pod template of your Deployment. Without the webhook no Pod gets
# the settings.
webhook:
  enabled: true
  # What happens to a Pod that has the annotation but cannot get the settings:
  # the webhook cannot be reached, no policy points at its Deployment, or the
  # policy cannot be applied to it. Fail rejects the Pod, and the message says
  # why. Ignore lets the Pod start as you wrote it, without the settings.
  failurePolicy: Fail
  # How many seconds the API server waits for the webhook.
  timeoutSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
