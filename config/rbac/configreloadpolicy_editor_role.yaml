# This rule is not used by the project config-reload-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the reload.nagisatosanae.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: config-reload-operator
    app.kubernetes.io/managed-by: kustomize
  name: configreloadpolicy-editor-role
rules:
- apiGroups:
  - reload.nagisatosanae.github.io
  resources:
  - configreloadpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - reload.nagisatosanae.github.io
  resources:
  - configreloadpolicies/status
  verbs:
  - get
