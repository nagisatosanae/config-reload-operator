# This rule is not used by the project config-reload-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to reload.nagisatosanae.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: config-reload-operator
    app.kubernetes.io/managed-by: kustomize
  name: configreloadpolicy-viewer-role
rules:
- apiGroups:
  - reload.nagisatosanae.github.io
  resources:
  - configreloadpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - reload.nagisatosanae.github.io
  resources:
  - configreloadpolicies/status
  verbs:
  - get
