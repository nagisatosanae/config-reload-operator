---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - reload.nagisatosanae.github.io
  resources:
  - configreloadpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - reload.nagisatosanae.github.io
  resources:
  - configreloadpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - reload.nagisatosanae.github.io
  resources:
  - configreloadpolicies/status
  verbs:
  - get
  - patch
  - update
