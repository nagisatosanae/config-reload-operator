apiVersion: reload.nagisatosanae.github.io/v1alpha1
kind: ConfigReloadPolicy
metadata:
  labels:
    app.kubernetes.io/name: config-reload-operator
  name: fluentd-reload
  namespace: demo
spec:
  workloadRef:
    name: fluentd-demo
  containers:
    - name: fluentd
      configMapRef:
        name: fluentd-config
      mountPath: /fluentd/etc
      reload:
        validateCommand: ["fluentd", "--dry-run", "-q", "-c", "/fluentd/etc/fluent.conf"]
