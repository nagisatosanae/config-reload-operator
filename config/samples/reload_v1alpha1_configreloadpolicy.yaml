apiVersion: reload.nagisatosanae.github.io/v1alpha1
kind: ConfigReloadPolicy
metadata:
  labels:
    app.kubernetes.io/name: config-reload-operator
  name: nginx-reload
  namespace: demo
spec:
  workloadRef:
    name: nginx-demo
  containers:
    - name: nginx
      configMapRef:
        name: nginx-config
      mountPath: /etc/nginx/conf.d
      reload:
        validateCommand: ["nginx", "-t"]
