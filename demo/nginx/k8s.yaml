# Local demo: one NGINX Deployment whose configuration comes from a ConfigMap.
# The Deployment does not mount it. The operator does that for every new Pod,
# from the policy in config/samples, because of the annotation on the Pod
# template. Change X-Config-Version / the return body to v2, re-apply, and
# watch.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: demo
data:
  default.conf: |
    server {
        listen 80;
        location / {
            add_header X-Config-Version v1;
            return 200 "v1\n";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
      annotations:
        # Asks for the watcher settings. It is on the Pod template, so every
        # Pod carries it.
        reload.nagisatosanae.github.io/inject: "true"
    spec:
      containers:
        - name: nginx
          image: ghcr.io/nagisatosanae/config-reload-operator/demo-nginx:0.4.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: demo
spec:
  selector:
    app: nginx-demo
  ports:
    - port: 80
      targetPort: 80
